alerts:
  - name: high_request_latency
    severity: warning
    condition: 'p95(response_sent.latency_ms, 5m) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#alert-1
  - name: high_request_error_rate
    severity: critical
    condition: 'count(request_failed, 5m) / count(request_received, 5m) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: 'count(tool_success == true, 10m) / count(tool_success != null, 10m) * 100 < 90'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: rag-oncall
    runbook: docs/alerts.md#alert-3
